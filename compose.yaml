services:
  api:
    build: .
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      SQLITE_PATH: /app/data/sessions.sqlite3
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  ui:
    build: .
    command: ["streamlit", "run", "apps/ui/main.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
