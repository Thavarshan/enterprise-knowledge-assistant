---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number
    || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Quality: Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --python 3.13
      - run: make lint

  format:
    name: "Quality: Format check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --python 3.13
      - run: make format-check

  build:
    name: "Verify: Package build"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: make build

  tests:
    name: "Verify: Tests (Python ${{ matrix.python-version }})"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: >-
          uv sync --locked --all-groups --python
          "${{ matrix.python-version }}"
      - run: make test

  docblocks:
    name: "Quality: Docblock check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --python 3.13
      - run: make docs-check

  comments:
    name: "Quality: Comments"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --python 3.13
      - run: make comments-check

  line-length:
    name: "Quality: Line length"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --python 3.13
      - run: make line-length-check

  syntax:
    name: "Quality: Syntax check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --python 3.13
      - run: make syntax-check

  typecheck:
    name: "Verify: Type check"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --python 3.13
      - run: make typecheck

  dependency-audit:
    name: "Verify: Dependency audit"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --python 3.13
      - run: make audit

  docker-api-ui:
    name: "Runtime: Docker Compose smoke"
    needs:
      - build
      - tests
      - typecheck
      - dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create a minimal CI environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          MOCK_MODE=true
          API_PORT=18000
          UI_PORT=18501
          EOF
      - name: Build and start Compose services
        run: >-
          docker compose --project-name eka-ci up --build
          --detach --wait --wait-timeout 120
      - name: Check API, UI, and service network
        shell: bash
        run: |
          set -Eeuo pipefail

          curl --fail --show-error http://127.0.0.1:18000/health
          curl --fail --show-error http://127.0.0.1:18000/ready

          docker compose --project-name eka-ci exec -T ui python -c '
          import os
          import httpx

          response = httpx.get(
              os.environ["API_BASE_URL"] + "/ready",
              timeout=5.0,
          )
          response.raise_for_status()
          '

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18501/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error --output /dev/null \
            http://127.0.0.1:18501/
      - name: Collect Compose logs after failure
        if: failure()
        run: docker compose --project-name eka-ci logs --no-color
      - name: Stop Compose services
        if: always()
        run: >-
          docker compose --project-name eka-ci down --volumes
          --remove-orphans || true
