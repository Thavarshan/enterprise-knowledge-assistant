---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number
    || github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: "Quality: Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - run: make lint

  format:
    name: "Quality: Format check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - run: make format-check

  build:
    name: "Build: Python package"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: make build

  tests:
    name: "Tests: Python ${{ matrix.python-version }}"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: >-
          uv sync --locked --all-groups --extra ui --python
          "${{ matrix.python-version }}"
      - run: make test

  docblocks:
    name: "Quality: Docblock check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - run: make docs-check

  comments:
    name: "Quality: Comments"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - run: make comments-check

  line-length:
    name: "Quality: Line length"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - run: make line-length-check

  syntax:
    name: "Quality: Syntax check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - run: make syntax-check

  typecheck:
    name: "Verify: Type check"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - run: make typecheck

  dependency-audit:
    name: "Security: Python dependency audit"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - run: make audit

  npm-audit:
    name: "Security: Worker dependency audit"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install the locked Worker dependency tree
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Reject high and critical npm advisories
        working-directory: infra/cloudflare/d1-gateway
        run: npm audit --audit-level=high

  cloudflare-config:
    name: "Worker: Wrangler config and bundle"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Validate Wrangler configuration and bundle
        working-directory: infra/cloudflare/d1-gateway
        run: npm run validate-config

  cloudflare-migrations:
    name: "Worker: Local D1 migrations"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Apply migrations to local D1
        working-directory: infra/cloudflare/d1-gateway
        run: npm run migrate:local

  cloudflare-typecheck:
    name: "Worker: TypeScript check"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Check Worker types
        working-directory: infra/cloudflare/d1-gateway
        run: npm run typecheck

  cloudflare-unit:
    name: "Worker: Unit tests"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Test public health, authorization, and input validation
        working-directory: infra/cloudflare/d1-gateway
        run: npm run test:unit

  cloudflare-integration:
    name: "Worker: D1 integration tests"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Test Worker routes against local D1
        working-directory: infra/cloudflare/d1-gateway
        run: npm run test:integration

  d1-api-integration:
    name: "Runtime: FastAPI through local D1"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - name: Test FastAPI through Wrangler and local D1
        run: make cloud-sim-test

  streamlit-smoke:
    name: "Runtime: Streamlit application startup"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --extra ui --python 3.13
      - name: Start and probe the Streamlit application
        run: uv run python -m scripts.deployment.check_streamlit_startup

  github-actions:
    name: "Verify: GitHub Actions workflow syntax"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-verified actionlint 1.7.12
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          release_root="https://github.com/rhysd/actionlint/releases/"
          release_path="download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "${release_root}${release_path}" --output "$archive"
          checksum_left="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123"
          checksum_right="cb3712530b08cc387b349a3d8"
          checksum="${checksum_left}${checksum_right}"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  deployment-config:
    name: "Verify: Cloud deployment configuration"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check deployment targets and dependency graph
        run: python3 -m scripts.deployment.check_deployment_config
      - name: Reject unsafe D1 migration changes
        run: python3 -m scripts.deployment.validate_d1_migrations

  docker-api-ui:
    name: "Runtime: Docker Compose smoke"
    needs:
      - build
      - tests
      - typecheck
      - dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create a minimal CI environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          MOCK_MODE=true
          API_PORT=18000
          UI_PORT=18501
          EOF
      - name: Build and start Compose services
        run: >-
          docker compose --project-name eka-ci up --build
          --detach --wait --wait-timeout 120
      - name: Check API, UI, and service network
        shell: bash
        run: |
          set -Eeuo pipefail

          curl --fail --show-error http://127.0.0.1:18000/health
          curl --fail --show-error http://127.0.0.1:18000/ready

          docker compose --project-name eka-ci exec -T ui python -c '
          import os
          import httpx

          response = httpx.get(
              os.environ["API_BASE_URL"] + "/ready",
              timeout=5.0,
          )
          response.raise_for_status()
          '

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18501/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error --output /dev/null \
            http://127.0.0.1:18501/
      - name: Collect Compose logs after failure
        if: failure()
        run: docker compose --project-name eka-ci logs --no-color
      - name: Stop Compose services
        if: always()
        run: >-
          docker compose --project-name eka-ci down --volumes
          --remove-orphans || true

  ci-gate:
    name: "Gate: All mandatory CI checks"
    if: always()
    needs:
      - lint
      - format
      - build
      - tests
      - docblocks
      - comments
      - line-length
      - syntax
      - typecheck
      - dependency-audit
      - npm-audit
      - cloudflare-config
      - cloudflare-migrations
      - cloudflare-typecheck
      - cloudflare-unit
      - cloudflare-integration
      - d1-api-integration
      - docker-api-ui
      - github-actions
      - deployment-config
      - streamlit-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every check to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m scripts.deployment.check_ci_gate

  readiness:
    name: "Gate: Deployment readiness"
    if: >-
      always() &&
      needs.ci-gate.result == 'success' &&
      ((github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    needs: [ci-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_deployment: ${{ steps.gate.outputs.run_deployment }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
    steps:
      - name: Check out the CI-approved release
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Evaluate CI, event, opt-ins, and release freshness
        id: gate
        env:
          TRIGGER: ${{ github.event_name }}
          CI_RESULT: ${{ needs.ci-gate.result }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          RUN_LIVE_E2E_SMOKE: ${{ vars.RUN_LIVE_E2E_SMOKE }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$CURRENT_MAIN_SHA" ]]; then
            echo "Could not verify the current main commit."
            exit 1
          fi
          export CURRENT_MAIN_SHA
          python3 -m scripts.deployment.readiness

  deploy-cloudflare:
    name: "Deploy: Cloudflare Worker and D1"
    needs: [readiness]
    if: needs.readiness.outputs.run_deployment == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    outputs:
      worker_url: ${{ vars.CLOUDFLARE_WORKER_URL }}
    env:
      CI_GATE_PASSED: "true"
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      RUN_LIVE_E2E_SMOKE: ${{ vars.RUN_LIVE_E2E_SMOKE }}
      RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
      STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
      STREAMLIT_BRANCH: ${{ vars.STREAMLIT_BRANCH }}
    steps:
      - name: Check out the exact approved commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Verify every target, credential name, and opt-in
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_SERVICE_TOKEN: ${{ secrets.D1_SERVICE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: >-
            ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMOKE_ANALYST_PASSWORD: ${{ secrets.SMOKE_ANALYST_PASSWORD }}
          SMOKE_VIEWER_PASSWORD: ${{ secrets.SMOKE_VIEWER_PASSWORD }}
        run: python3 -m scripts.deployment.deployment_preflight
      - name: Validate local Wrangler config and bundle
        working-directory: infra/cloudflare/d1-gateway
        run: npm run validate-config
      - name: Reject destructive or unstable migrations
        run: python3 -m scripts.deployment.validate_d1_migrations
      - name: Render deployment-only Wrangler config
        working-directory: infra/cloudflare/d1-gateway
        run: npm run deployment:config
      - name: Verify exact Cloudflare account database target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -m scripts.deployment.verify_cloudflare_target
      - name: Inspect remote migrations before approval applies them
        working-directory: infra/cloudflare/d1-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrations:remote:list
      - name: Apply approved forward-only remote migrations
        working-directory: infra/cloudflare/d1-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrate:remote
      - name: Deploy Worker with its service token
        working-directory: infra/cloudflare/d1-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_SERVICE_TOKEN: ${{ secrets.D1_SERVICE_TOKEN }}
        run: npm run deploy

  smoke-cloudflare:
    name: "Smoke: Cloudflare Worker and D1"
    needs: [readiness, deploy-cloudflare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out deployment smoke scripts
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          persist-credentials: false
      - name: Verify service authentication and D1 read/write
        env:
          CLOUDFLARE_WORKER_URL: >-
            ${{ needs.deploy-cloudflare.outputs.worker_url }}
          D1_SERVICE_TOKEN: ${{ secrets.D1_SERVICE_TOKEN }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
        run: python3 -m scripts.deployment.smoke_cloudflare

  deploy-vercel:
    name: "Deploy: Stage Vercel FastAPI"
    needs: [readiness, smoke-cloudflare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    outputs:
      stage_url: ${{ steps.stage.outputs.stage_url }}
      previous_deployment_ref: >-
        ${{ steps.stage.outputs.previous_deployment_ref }}
    steps:
      - name: Check out the exact approved commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install reviewed Vercel CLI 65.16.0
        run: npm install --global --ignore-scripts vercel@65.16.0
      - name: Build and stage without assigning production domains
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
        run: python3 -m scripts.deployment.vercel_control stage

  smoke-vercel:
    name: "Smoke: Staged Vercel FastAPI"
    needs: [readiness, deploy-vercel]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out deployment smoke scripts
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          persist-credentials: false
      - name: Check health, D1, identity, sessions, and ownership
        env:
          VERCEL_URL: ${{ needs.deploy-vercel.outputs.stage_url }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          SMOKE_ANALYST_PASSWORD: ${{ secrets.SMOKE_ANALYST_PASSWORD }}
          SMOKE_VIEWER_PASSWORD: ${{ secrets.SMOKE_VIEWER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: >-
            ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python3 -m scripts.deployment.smoke_vercel

  promote-vercel:
    name: "Promote: Verified Vercel FastAPI"
    needs: [readiness, deploy-vercel, smoke-vercel]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    outputs:
      production_url: ${{ steps.promote.outputs.production_url }}
    steps:
      - name: Check out the exact approved commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install reviewed Vercel CLI 65.16.0
        run: npm install --global --ignore-scripts vercel@65.16.0
      - name: Promote the tested deployment
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_STAGE_URL: ${{ needs.deploy-vercel.outputs.stage_url }}
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
          VERCEL_PREVIOUS_DEPLOYMENT_REF: >-
            ${{ needs.deploy-vercel.outputs.previous_deployment_ref }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
        run: python3 -m scripts.deployment.vercel_control promote

  promote-streamlit:
    name: "Promote: Streamlit source branch"
    needs: [readiness, promote-vercel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    outputs:
      branch_sha: ${{ steps.promote.outputs.branch_sha }}
    steps:
      - name: Check out the exact approved commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Fast-forward deploy/streamlit without force push
        id: promote
        env:
          CI_GATE_PASSED: "true"
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          STREAMLIT_BRANCH: ${{ vars.STREAMLIT_BRANCH }}
        run: python3 -m scripts.deployment.promote_streamlit

  streamlit-readiness:
    name: "Verify: Streamlit Community Cloud release"
    needs: [readiness, promote-streamlit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out the exact promoted source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.promote-streamlit.outputs.branch_sha }}
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
      - name: Install pinned Playwright and Chromium
        run: |
          uv pip install --system \
            --requirement scripts/deployment/requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Wait for the exact Streamlit release to load
        env:
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
        run: python3 -m scripts.deployment.poll_streamlit

  post-deploy-cloudflare:
    name: "Smoke: Cloudflare Worker and D1"
    needs:
      - readiness
      - deploy-cloudflare
      - promote-vercel
      - streamlit-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          persist-credentials: false
      - name: Test authenticated Worker and D1 read/write
        env:
          CLOUDFLARE_WORKER_URL: >-
            ${{ needs.deploy-cloudflare.outputs.worker_url }}
          D1_SERVICE_TOKEN: ${{ secrets.D1_SERVICE_TOKEN }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
        run: python3 -m scripts.deployment.smoke_cloudflare

  post-deploy-vercel:
    name: "Smoke: Vercel FastAPI"
    needs:
      - readiness
      - deploy-cloudflare
      - promote-vercel
      - streamlit-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          persist-credentials: false
      - name: Test API, authentication, and D1 session persistence
        env:
          VERCEL_URL: ${{ needs.promote-vercel.outputs.production_url }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          SMOKE_ANALYST_PASSWORD: ${{ secrets.SMOKE_ANALYST_PASSWORD }}
          SMOKE_VIEWER_PASSWORD: ${{ secrets.SMOKE_VIEWER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: >-
            ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python3 -m scripts.deployment.smoke_vercel

  post-deploy-streamlit:
    name: "Smoke: Streamlit Community Cloud"
    needs:
      - readiness
      - deploy-cloudflare
      - promote-vercel
      - streamlit-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
      - name: Install pinned Playwright and Chromium
        run: |
          uv pip install --system \
            --requirement scripts/deployment/requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Verify page and deployed source SHA
        env:
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
        run: python3 -m scripts.deployment.smoke_streamlit

  post-deploy-end-to-end:
    name: "Smoke: Full-stack synthetic conversation"
    needs:
      - readiness
      - promote-vercel
      - post-deploy-cloudflare
      - post-deploy-vercel
      - post-deploy-streamlit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
      - name: Install pinned Playwright and Chromium
        run: |
          uv pip install --system \
            --requirement scripts/deployment/requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Send one synthetic, live model-backed conversation
        env:
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
          VERCEL_PRODUCTION_URL: >-
            ${{ needs.promote-vercel.outputs.production_url }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          SMOKE_ANALYST_PASSWORD: ${{ secrets.SMOKE_ANALYST_PASSWORD }}
          SMOKE_VIEWER_PASSWORD: ${{ secrets.SMOKE_VIEWER_PASSWORD }}
        run: python3 -m scripts.deployment.smoke_full_stack

  post-deploy-smoke-result:
    name: "Result: Post-deployment verification"
    if: >-
      always() && needs.readiness.outputs.run_deployment == 'true'
    needs:
      - readiness
      - post-deploy-cloudflare
      - post-deploy-vercel
      - post-deploy-streamlit
      - post-deploy-end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          persist-credentials: false
      - name: Require every post-deployment check to succeed
        env:
          DEPLOY_NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
        run: python3 -m scripts.deployment.check_deployment_result

  deployment-result:
    name: "Result: Production deployment"
    if: always() && needs.readiness.outputs.run_deployment == 'true'
    needs:
      - readiness
      - deploy-cloudflare
      - smoke-cloudflare
      - deploy-vercel
      - smoke-vercel
      - promote-vercel
      - promote-streamlit
      - streamlit-readiness
      - post-deploy-cloudflare
      - post-deploy-vercel
      - post-deploy-streamlit
      - post-deploy-end-to-end
      - post-deploy-smoke-result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every deployment and smoke job to succeed
        env:
          DEPLOY_NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
        run: python3 -m scripts.deployment.check_deployment_result
