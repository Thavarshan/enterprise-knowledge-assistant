---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number
    || github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: "Quality: Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --all-extras --python 3.13
      - run: make lint

  format:
    name: "Quality: Format check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --all-extras --python 3.13
      - run: make format-check

  build:
    name: "Build: Python package"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: make build

  tests:
    name: "Tests: Python ${{ matrix.python-version }}"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: >-
          uv sync --locked --all-groups --all-extras --python
          "${{ matrix.python-version }}"
      - run: make test

  docblocks:
    name: "Quality: Docblock check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --all-extras --python 3.13
      - run: make docs-check

  comments:
    name: "Quality: Comments"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --all-extras --python 3.13
      - run: make comments-check

  line-length:
    name: "Quality: Line length"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --all-extras --python 3.13
      - run: make line-length-check

  syntax:
    name: "Quality: Syntax check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --all-extras --python 3.13
      - run: make syntax-check

  typecheck:
    name: "Verify: Type check"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --all-extras --python 3.13
      - run: make typecheck

  dependency-audit:
    name: "Security: Python dependency audit"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --all-extras --python 3.13
      - run: make audit

  npm-audit:
    name: "Security: Worker dependency audit"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install the locked Worker dependency tree
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      # The current picomatch advisory has no patched release. The checker
      # allows only that advisory in the development-only dependency tree.
      - name: Audit Worker dependencies and known unpatched advisory
        working-directory: infra/cloudflare/d1-gateway
        run: python3 ../../../scripts/deployment/check_npm_audit.py

  cloudflare-config:
    name: "Worker: Wrangler config and bundle"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Validate Wrangler configuration and bundle
        working-directory: infra/cloudflare/d1-gateway
        run: npm run validate-config

  cloudflare-migrations:
    name: "Worker: Local D1 migrations"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Apply migrations to local D1
        working-directory: infra/cloudflare/d1-gateway
        run: npm run migrate:local

  cloudflare-typecheck:
    name: "Worker: TypeScript check"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Check Worker types
        working-directory: infra/cloudflare/d1-gateway
        run: npm run typecheck

  cloudflare-unit:
    name: "Worker: Unit tests"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Test public health, authorization, and input validation
        working-directory: infra/cloudflare/d1-gateway
        run: npm run test:unit

  cloudflare-integration:
    name: "Worker: D1 integration tests"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Test Worker routes against local D1
        working-directory: infra/cloudflare/d1-gateway
        run: npm run test:integration

  d1-api-integration:
    name: "Runtime: FastAPI through local D1"
    needs:
      - lint
      - format
      - docblocks
      - comments
      - line-length
      - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups --all-extras --python 3.13
      - name: Test FastAPI through Wrangler and local D1
        run: make cloud-sim-test

  github-actions:
    name: "Verify: GitHub Actions workflow syntax"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-verified actionlint 1.7.12
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          release_root="https://github.com/rhysd/actionlint/releases/"
          release_path="download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "${release_root}${release_path}" --output "$archive"
          checksum_left="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123"
          checksum_right="cb3712530b08cc387b349a3d8"
          checksum="${checksum_left}${checksum_right}"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  deployment-config:
    name: "Verify: Cloud deployment configuration"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check deployment targets and dependency graph
        run: python3 -m scripts.deployment.check_deployment_config
      - name: Reject unsafe D1 migration changes
        run: python3 -m scripts.deployment.validate_d1_migrations

  docker-compose-api:
    name: "Runtime: Docker Compose API smoke"
    needs:
      - build
      - tests
      - typecheck
      - dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create a minimal CI environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          MOCK_MODE=true
          API_PORT=18000
          EOF
      - name: Build and start Compose services
        run: >-
          docker compose --project-name eka-ci up --build
          --detach --wait --wait-timeout 120 api
      - name: Check API and Compose service status
        shell: bash
        run: |
          set -Eeuo pipefail

          curl --fail --show-error http://127.0.0.1:18000/health
          curl --fail --show-error http://127.0.0.1:18000/ready

          docker compose --project-name eka-ci ps --status running api
      - name: Collect Compose logs after failure
        if: failure()
        run: docker compose --project-name eka-ci logs --no-color
      - name: Stop Compose services
        if: always()
        run: >-
          docker compose --project-name eka-ci down --volumes
          --remove-orphans || true

  ci-gate:
    name: "Gate: All mandatory CI checks"
    if: always()
    needs:
      - lint
      - format
      - build
      - tests
      - docblocks
      - comments
      - line-length
      - syntax
      - typecheck
      - dependency-audit
      - npm-audit
      - cloudflare-config
      - cloudflare-migrations
      - cloudflare-typecheck
      - cloudflare-unit
      - cloudflare-integration
      - d1-api-integration
      - docker-compose-api
      - github-actions
      - deployment-config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every check to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m scripts.deployment.check_ci_gate

  readiness:
    name: "Gate: Deployment readiness"
    if: >-
      always() &&
      needs.ci-gate.result == 'success' &&
      ((github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    needs: [ci-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_deployment: ${{ steps.gate.outputs.run_deployment }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
    steps:
      - name: Check out the CI-approved release
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Evaluate CI, event, and release freshness
        id: gate
        env:
          TRIGGER: ${{ github.event_name }}
          CI_RESULT: ${{ needs.ci-gate.result }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$CURRENT_MAIN_SHA" ]]; then
            echo "Could not verify the current main commit."
            exit 1
          fi
          export CURRENT_MAIN_SHA
          python3 -m scripts.deployment.readiness

  deploy-cloudflare:
    name: "Deploy: Viridian D1 gateway and database"
    needs: [readiness]
    if: needs.readiness.outputs.run_deployment == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    outputs:
      worker_url: ${{ vars.CLOUDFLARE_D1_GATEWAY_URL }}
    env:
      CI_GATE_PASSED: "true"
      RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_GATEWAY_URL: ${{ vars.CLOUDFLARE_D1_GATEWAY_URL }}
    steps:
      - name: Check out the exact approved commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/d1-gateway/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: infra/cloudflare/d1-gateway
        run: npm ci
      - name: Verify every target and credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_SERVICE_TOKEN: ${{ secrets.D1_SERVICE_TOKEN }}
        run: python3 -m scripts.deployment.deployment_preflight
      - name: Validate local Wrangler config and bundle
        working-directory: infra/cloudflare/d1-gateway
        run: npm run validate-config
      - name: Reject destructive or unstable migrations
        run: python3 -m scripts.deployment.validate_d1_migrations
      - name: Render deployment-only Wrangler config
        working-directory: infra/cloudflare/d1-gateway
        run: npm run deployment:config
      - name: Verify exact Cloudflare account database target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -m scripts.deployment.verify_cloudflare_target
      - name: Inspect remote migrations before approval applies them
        working-directory: infra/cloudflare/d1-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrations:remote:list
      - name: Apply approved forward-only remote migrations
        working-directory: infra/cloudflare/d1-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrate:remote
      - name: Deploy Viridian D1 gateway
        working-directory: infra/cloudflare/d1-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_SERVICE_TOKEN: ${{ secrets.D1_SERVICE_TOKEN }}
        run: npm run deploy

  smoke-cloudflare:
    name: "Smoke: Viridian D1 gateway and database"
    needs: [readiness, deploy-cloudflare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out deployment smoke scripts
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          persist-credentials: false
      - name: Verify service authentication and D1 read/write
        env:
          CLOUDFLARE_D1_GATEWAY_URL: >-
            ${{ needs.deploy-cloudflare.outputs.worker_url }}
          D1_SERVICE_TOKEN: ${{ secrets.D1_SERVICE_TOKEN }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
        run: python3 -m scripts.deployment.smoke_cloudflare

  deploy-vercel-api:
    name: "Deploy: Viridian API on Vercel"
    needs: [readiness, smoke-cloudflare]
    if: needs.readiness.outputs.run_deployment == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: "65.16.0"
    steps:
      - name: Check out the exact approved commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      # astral-sh/setup-uv v10.3.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: 0.13.7
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Require Vercel production credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Add VERCEL_TOKEN to the GitHub production environment."
            exit 1
          fi
          if [[ -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "::error::Set VERCEL_ORG_ID and VERCEL_PROJECT_ID in the GitHub production environment."
            exit 1
          fi
      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production
      - name: Build approved API release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod
      - name: Deploy approved API release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes

  smoke-vercel-api:
    name: "Smoke: Vercel API"
    needs: [readiness, deploy-vercel-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_API_URL: ${{ vars.VERCEL_API_URL }}
      RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
    steps:
      - name: Verify API liveness, D1 readiness, and provider configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${VERCEL_API_URL:-}" ]]; then
            echo "::error::Set VERCEL_API_URL in the GitHub production environment."
            exit 1
          fi
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            --retry-all-errors "$VERCEL_API_URL/health"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            --retry-all-errors "$VERCEL_API_URL/ready"
          version="$(curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "$VERCEL_API_URL/version")"
          printf '%s' "$version" | jq --exit-status \
            '.mode == "live" and .provider == "openai" and .retrieval == "pinecone"' \
            >/dev/null
          echo "Vercel API is healthy for release $RELEASE_SHA."

  deployment-result:
    name: "Result: Production deployment"
    if: always() && needs.readiness.outputs.run_deployment == 'true'
    needs:
      - readiness
      - deploy-cloudflare
      - smoke-cloudflare
      - deploy-vercel-api
      - smoke-vercel-api
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the approved release
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.readiness.outputs.release_sha }}
          persist-credentials: false
      - name: Require every deployment and smoke job to succeed
        env:
          DEPLOY_NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          CLOUDFLARE_D1_GATEWAY_URL: >-
            ${{ needs.deploy-cloudflare.outputs.worker_url }}
          VERCEL_API_URL: ${{ vars.VERCEL_API_URL }}
        run: python3 -m scripts.deployment.check_deployment_result
