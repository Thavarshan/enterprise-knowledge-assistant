[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "A modular monolith foundation for an explainable enterprise AI assistant."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "langgraph>=1.0,<2.0",
  "langsmith>=0.4,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "streamlit>=1.45,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "autopep8>=2.3,<3.0",
  "mypy>=1.14,<2.0",
  "pip-audit>=2.10.1,<3.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_assistant", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.autopep8]
max_line_length = 100

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = [".venv", "build", "dist"]
