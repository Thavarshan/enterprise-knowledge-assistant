repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: docstrings
        name: Validate first-party Python docstrings
        entry: uv run python scripts/check_docstrings.py
        language: system
        always_run: true
        pass_filenames: false
